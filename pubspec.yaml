name: qulpynai_mobile
description: "Qulpynai Bakery — мобильное приложение (iOS + Android)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_svg: ^2.5.0
  go_router: ^18.1.4
  intl: ^0.20.3
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway-400.ttf
          weight: 400
        - asset: assets/fonts/Raleway-500.ttf
          weight: 500
        - asset: assets/fonts/Raleway-600.ttf
          weight: 600
        - asset: assets/fonts/Raleway-700.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-500.ttf
          weight: 500
        - asset: assets/fonts/Lora-600.ttf
          weight: 600
        - asset: assets/fonts/Lora-700.ttf
          weight: 700
    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Gilroy-Bold.ttf
          weight: 700
    - family: GilroyTenge
      fonts:
        - asset: assets/fonts/Gilroy-Tenge.ttf
